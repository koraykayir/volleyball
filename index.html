<style>
/* Layout: one phone-width column (max 620px). A court-blue scoreboard band spans the full width on top;
   below it flat lists with hairlines (playing / bench); organizer tools sit in one panel at the end. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --fg:#141B2B; --muted:#5B6578; --line:#D8DDE7; --soft:#E9EDF5;
  --court:#1E4FD6; --court-deep:#173FB0; --court-ink:#FFFFFF;
  --zone:#E8651A; --zone-soft:#FDEEE3;
  --ok:#178A4C; --ok-soft:#E3F4E9;
  --bad:#C0392B; --bad-soft:#FBE7E4;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:Barlow,"Helvetica Neue",Arial,sans-serif;
  --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --surface:#171F31; --fg:#ECEFF6; --muted:#9AA5BC; --line:#2B354A; --soft:#1F2940;
    --court:#2F62E8; --court-deep:#2450C8; --court-ink:#FFFFFF;
    --zone:#FF8A3D; --zone-soft:#3A2415;
    --ok:#3DBD74; --ok-soft:#14301F;
    --bad:#F0705F; --bad-soft:#3B1C19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#171F31; --fg:#ECEFF6; --muted:#9AA5BC; --line:#2B354A; --soft:#1F2940;
  --court:#2F62E8; --court-deep:#2450C8; --court-ink:#FFFFFF;
  --zone:#FF8A3D; --zone-soft:#3A2415;
  --ok:#3DBD74; --ok-soft:#14301F;
  --bad:#F0705F; --bad-soft:#3B1C19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--fg); font:16px/1.45 var(--body); -webkit-text-size-adjust:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--court)}
h1,h2,h3,h4,h5{margin:0; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--court)}
[hidden]{display:none!important}
.band{background:var(--court); color:var(--court-ink)}
.band .in{max-width:620px; margin:0 auto; padding-block:16px 20px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.kicker{font:600 12px/1 var(--body); letter-spacing:.12em; text-transform:uppercase; opacity:.85; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.band .tag{display:inline-block; font:600 11px/1 var(--body); letter-spacing:.1em; text-transform:uppercase; padding:5px 8px; border-radius:999px; background:rgba(255,255,255,.2); color:var(--court-ink)}
.hist{border-bottom:1px solid var(--line); padding:9px 0}
.hist:last-child{border-bottom:0}
.hist summary{cursor:pointer; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-weight:500; list-style:none}
.hist summary::-webkit-details-marker{display:none}
.hist summary .cnt{font-weight:400; color:var(--muted); font-size:13.5px}
.hbody{padding:8px 0 2px 2px; display:flex; flex-direction:column; gap:6px; font-size:14.5px}
.hbody ol{margin:0; padding-left:24px; display:flex; flex-direction:column; gap:3px}
.hroster{font-size:13.5px; color:var(--muted); display:flex; flex-direction:column; gap:6px}
.statgrid{display:grid; grid-template-columns:1fr auto auto auto; gap:4px 14px; font-size:14px; font-variant-numeric:tabular-nums}
.statgrid b{font:600 11.5px/1.6 var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.hist.stats{border-bottom:1px solid var(--line)}
.ev-title{font:700 32px/1.05 var(--display); letter-spacing:.01em; margin-top:8px}
.ev-meta{margin-top:4px; font-size:15px; opacity:.9}
.score{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:14px}
.spots{font:700 44px/1 var(--display); font-variant-numeric:tabular-nums; letter-spacing:.01em}
.spots small{font-size:20px; opacity:.75; font-weight:600}
.score .lbl{font-size:13px; opacity:.85; text-align:right}
.bar{height:6px; border-radius:3px; background:rgba(255,255,255,.28); margin-top:10px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--court-ink); border-radius:3px}
.wrap{max-width:620px; margin:0 auto; padding-block:14px 56px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:22px}
.status{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
.status .sp{flex:1 1 auto}
.sec{font:600 12.5px/1 var(--body); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; display:flex; align-items:center; gap:8px}
.sec .cnt{font-weight:500; letter-spacing:0; text-transform:none; color:var(--muted)}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--zone)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px}
.card h3{font:700 22px/1.1 var(--display); letter-spacing:.01em}
.card p{margin:6px 0 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.row{display:grid; grid-template-columns:40px 1fr auto; gap:10px; align-items:center; padding-block:9px; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.pending{opacity:.6}
.pos{font:600 22px/1 var(--display); color:var(--muted); font-variant-numeric:tabular-nums}
.bench .pos{color:var(--zone)}
.who{min-width:0}
.who .n{font-weight:500; overflow-wrap:anywhere}
.who .e{font-size:12.5px; color:var(--muted); overflow-wrap:anywhere}
.who .t{font-size:12px; color:var(--muted)}
.right{display:flex; align-items:center; gap:8px}
.pill{font:500 12px/1 var(--body); padding:5px 8px; border-radius:999px; background:var(--soft); color:var(--muted); white-space:nowrap}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.pend{background:transparent; border:1px dashed var(--line)}
.pill.you{background:var(--court); color:var(--court-ink)}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none}
.chk input{width:18px; height:18px; accent-color:var(--ok); margin:0; cursor:pointer}
.empty{padding:14px 0; color:var(--muted); font-size:14px}
.btn{font:600 15px/1 var(--body); padding:11px 16px; border-radius:var(--radius); border:1px solid var(--court); background:var(--court); color:var(--court-ink); cursor:pointer; white-space:nowrap}
.btn:hover{background:var(--court-deep); border-color:var(--court-deep)}
.btn.outline{background:transparent; color:var(--court)}
.btn.outline:hover{background:var(--soft)}
.btn.ghost{background:transparent; border-color:var(--line); color:var(--fg)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:transparent; border-color:var(--bad); color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:7px 10px; font-size:13px}
.btn.xs{padding:5px 8px; font-size:12px}
.btn.big{width:100%; padding:14px; font-size:17px}
.btn:disabled{opacity:.5; cursor:default}
a.btn{text-decoration:none; display:inline-block; line-height:1}
.btn:focus-visible,.inp:focus-visible,.chip:focus-visible,.chk input:focus-visible{outline:2px solid var(--zone); outline-offset:2px}
.link{background:none; border:0; padding:0; color:var(--court); cursor:pointer; font-weight:600; font-size:inherit}
.link:hover{text-decoration:underline}
.inp{width:100%; font:15px/1.3 var(--body); padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); color:var(--fg)}
.inp:focus{outline:2px solid var(--court); outline-offset:1px; border-color:transparent}
.inp.err{border-color:var(--bad)}
textarea.inp{min-height:70px; resize:vertical}
label.f{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:4px}
.field{display:flex; flex-direction:column}
.stack{display:flex; flex-direction:column; gap:10px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
@media (max-width:420px){.grid2,.grid3{grid-template-columns:1fr}}
.actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.note{font-size:13.5px; color:var(--muted); background:var(--soft); padding:10px 12px; border-radius:var(--radius); overflow-wrap:anywhere}
.note.warn{background:var(--zone-soft); color:var(--fg)}
.note.ok{background:var(--ok-soft); color:var(--fg)}
.note.bad{background:var(--bad-soft); color:var(--fg)}
.note code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px}
.org{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:22px}
.org .sub{display:flex; flex-direction:column; gap:10px}
.org .sub > .sec{margin:0}
.orghead{display:flex; align-items:center; justify-content:space-between; gap:10px}
.orghead h3{font:700 24px/1 var(--display); letter-spacing:.01em}
.steps{margin:0; padding-left:20px; font-size:14px; display:flex; flex-direction:column; gap:6px}
.steps code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; background:var(--soft); padding:1px 5px; border-radius:4px}
details.help summary{cursor:pointer; font-weight:600; font-size:14px; color:var(--court)}
details.help{font-size:14px}
.court{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--surface)}
.court h4{font:700 17px/1 var(--display); letter-spacing:.06em; text-transform:uppercase; background:var(--court); color:var(--court-ink); padding:8px 12px; display:flex; justify-content:space-between; align-items:center}
.court h4 small{font:500 12px/1 var(--body); letter-spacing:0; text-transform:none; opacity:.85}
.teams{display:grid; grid-template-columns:1fr 1fr}
.team{padding:10px 12px; min-width:0; display:flex; flex-direction:column; gap:8px}
.team + .team{border-left:2px dashed var(--line)}
.team h5{font:600 12px/1 var(--body); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); display:flex; justify-content:space-between}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font:500 14px/1.2 var(--body); padding:7px 10px; border-radius:6px; background:var(--soft); color:var(--fg); border:1px solid transparent; cursor:pointer; text-align:left; overflow-wrap:anywhere}
.chip.sel{border-color:var(--court); background:var(--court); color:var(--court-ink)}
.chip.unpaid{border-style:dashed; border-color:var(--zone); background:var(--zone-soft)}
.chip.add{border:1px dashed var(--line); background:transparent; color:var(--muted)}
.chip.static{cursor:default}
.courts{display:flex; flex-direction:column; gap:12px}
.rlist{display:flex; flex-direction:column; gap:6px}
.rating{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.rating .rn{font-weight:500; min-width:0}
.rchips{display:flex; gap:4px}
.rchips .chip{padding:6px 9px; font-variant-numeric:tabular-nums}
.preview{border:2px solid var(--court); border-radius:10px; padding:14px; background:var(--surface); display:flex; flex-direction:column; gap:12px}
.preview .ph{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap}
.preview .ph h3{font:700 28px/1 var(--display)}
.legend{font-size:12.5px; color:var(--muted)}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 14px; border-radius:var(--radius); font-size:14px; z-index:20; opacity:0; pointer-events:none; transition:opacity .2s; max-width:min(92vw,520px); text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.footer{font-size:12.5px; color:var(--muted); text-align:center}
.hr{height:1px; background:var(--line)}
.banner{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.tip{font-size:12.5px; color:var(--muted); margin-top:4px}
.dotlive{width:8px; height:8px; border-radius:50%; background:var(--muted); flex:0 0 auto}
.dotlive.live{background:var(--ok)}
.dotlive.offline,.dotlive.demo{background:var(--zone)}
.dotlive.error{background:var(--bad)}
.status.bad{color:var(--bad)}
.orghead .orgwho{flex:1 1 auto; text-align:right; overflow-wrap:anywhere}
</style>
<!--artifact:head-end-->

/* ================= data model =================
